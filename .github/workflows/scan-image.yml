name: Upwind Shift Left Scanning

on:
  workflow_dispatch:
    inputs:
      image_name:
        required: true
        description: Image name to be scanned
        type: string
      repo:
        description: Name of the original repository
        type: string
      run_id:
        description: Run ID of the originating job
        type: number
  workflow_call:
    inputs:
      image_name:
        required: true
        description: Image name to be scanned
        type: string
      repo:
        required: true
        description: Name of the original repository
        type: string
      run_id:
        required: true
        description: Run ID of the originating job
        type: number

env:
  AWS_REGION: <your account region>
  AWS_ACCOUNT_ID: <your account ID>

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

jobs:
  scan:
    name: Remote Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: << name of role >>

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}
          mask-password: 'true'

      - name: Pull the image
        run: |
          docker pull ${{ inputs.image_name }}

      - name: Upwind Security ShiftLeft Scan
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@main
        continue-on-error: true
        with:
          upwind_client_id: ${{ secrets.UPWIND_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}
          docker_image: ${{ inputs.image_name }}
          pull_image: false
